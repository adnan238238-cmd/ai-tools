<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vice Race 2P — Online Multiplayer Demo</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0016; font-family: 'Segoe UI', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
  }
  #stage { position: relative; }
  #game { border-radius: 12px; box-shadow: 0 0 60px rgba(255,0,200,.25); cursor: pointer; }

  .overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  #menu { background: linear-gradient(180deg, #1a0033 0%, #4b0f6b 35%, #c22e83 60%, #ff7b4f 85%, #2b0a3d 100%); }
  .overlay.hidden { display: none; }

  h1.gta {
    font-size: 52px; font-weight: 900; letter-spacing: 4px; margin-bottom: 6px;
    background: linear-gradient(90deg, #7df9ff, #ff6ec7, #ffe14f);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: #ffd9f2; letter-spacing: 6px; font-size: 13px; margin-bottom: 30px; text-transform: uppercase; }

  .btn {
    font-size: 20px; font-weight: 800; letter-spacing: 2px;
    padding: 14px 44px; margin: 8px; border: none; border-radius: 40px;
    cursor: pointer; text-transform: uppercase; color: #14001f;
    background: linear-gradient(90deg, #ff6ec7, #7df9ff);
    box-shadow: 0 0 25px rgba(255,110,199,.55);
    transition: transform .15s;
  }
  .btn:hover { transform: scale(1.05); }
  .btn.ghost {
    background: transparent; color: #ffd9f2;
    border: 2px solid #ff6ec7; box-shadow: none;
  }
  #codeBox {
    display: none; margin-top: 18px; padding: 14px 26px; border-radius: 14px;
    background: rgba(0,0,0,.35); color: #ffe14f;
    font-size: 30px; font-weight: 900; letter-spacing: 12px;
  }
  #codeBox small { display: block; font-size: 11px; letter-spacing: 2px; color: #ffd9f2; margin-bottom: 4px; font-weight: 400; }
  #joinRow { display: none; margin-top: 10px; }
  #joinCode {
    width: 150px; padding: 12px; font-size: 22px; text-align: center;
    letter-spacing: 8px; text-transform: uppercase;
    border: 2px solid #7df9ff; border-radius: 12px;
    background: rgba(0,0,0,.4); color: #7df9ff; outline: none;
  }
  #status { margin-top: 14px; color: #ffd9f2; font-size: 14px; min-height: 18px; }
  .hint { margin-top: 24px; color: #ffd9f2; font-size: 12px; opacity: .8; line-height: 1.8; }

  #raceover { background: rgba(20,0,30,.88); }
  #raceover h2 {
    font-size: 54px; font-weight: 900; letter-spacing: 2px; color: #e6e6e6;
    font-family: 'Times New Roman', serif; text-shadow: 3px 3px 0 #7a0010; margin-bottom: 10px;
  }
  #raceover h2.win  { text-shadow: 3px 3px 0 #0f7a2b; }
  #raceScore { color: #7df9ff; font-size: 20px; margin-bottom: 28px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="480" height="720"></canvas>

  <div id="menu" class="overlay">
    <h1 class="gta">VICE&nbsp;RACE&nbsp;2P</h1>
    <div class="sub">Online two-player race &middot; fan-made demo</div>

    <div id="homeBtns">
      <button class="btn" id="hostBtn">🎮 Create Room</button><br>
      <button class="btn ghost" id="showJoinBtn">🔗 Join Room</button>
    </div>

    <div id="joinRow">
      <input id="joinCode" maxlength="4" placeholder="CODE">
      <button class="btn" id="joinBtn">Go</button>
    </div>

    <div id="codeBox"><small>Send this code to your friend</small><span id="codeText"></span></div>
    <div id="status"></div>

    <div class="hint">
      🏁 First to <b>500m</b> wins · Crash = instant loss<br>
      Move: <b>← →</b> / <b>A D</b> · touch-drag on phone · Same traffic for both players
    </div>
  </div>

  <div id="raceover" class="overlay hidden">
    <h2 id="raceTitle">YOU WIN!</h2>
    <div id="raceScore"></div>
    <button class="btn" id="rematchBtn">↻ Rematch</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const $ = id => document.getElementById(id);
  const TARGET = 500;              // meters

  // ================= networking (PeerJS — free public broker) =================
  const PREFIX = 'vice-race-6f-';
  let peer = null, conn = null, isHost = false;
  let opp = { dist: 0, x: W/2 - 25, alive: true };

  function setStatus(t) { $('status').textContent = t; }

  function makeCode() {
    const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ';
    return Array.from({length: 4}, () => abc[Math.floor(Math.random() * abc.length)]).join('');
  }

  function hostRoom() {
    isHost = true;
    $('homeBtns').style.display = 'none';
    const code = makeCode();
    setStatus('Creating room...');
    peer = new Peer(PREFIX + code);
    peer.on('open', () => {
      $('codeText').textContent = code;
      $('codeBox').style.display = 'block';
      setStatus('Waiting for your friend to join...');
    });
    peer.on('connection', c => {
      if (conn) { c.close(); return; }
      bindConn(c);
    });
    peer.on('error', e => fail(e));
  }

  function joinRoom() {
    const code = $('joinCode').value.trim().toUpperCase();
    if (code.length !== 4) { setStatus('Enter the 4-letter code!'); return; }
    isHost = false;
    $('homeBtns').style.display = 'none';
    setStatus('Joining ' + code + '...');
    peer = new Peer();
    peer.on('open', () => {
      bindConn(peer.connect(PREFIX + code, { reliable: true }));
    });
    peer.on('error', e => fail(e));
  }

  function bindConn(c) {
    conn = c;
    c.on('open', () => {
      setStatus('✅ Connected! Get ready...');
      startCountdown();
    });
    c.on('data', onData);
    c.on('close', () => { if (playing) opp.alive = false; });
    c.on('error', e => fail(e));
  }

  function fail(e) {
    setStatus('❌ Connection failed: ' + (e.type || e.message || 'unknown') + ' — try again');
    $('homeBtns').style.display = 'block';
    $('codeBox').style.display = 'none';
  }

  function send(msg) { if (conn && conn.open) conn.send(msg); }

  function onData(m) {
    if (m.type === 'seed') { onSeed(m.seed); return; }
    if (m.type === 'state') {
      opp.dist = m.dist; opp.x = m.x; opp.alive = m.alive;
      if (!opp.alive && playing) raceOver(true);
      if (m.won && playing) raceOver(false);
    } else if (m.type === 'rematch') {
      startCountdown();
    }
  }

  // ================= shared race logic =================
  // mulberry32: both players generate identical traffic from the same seed
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  let playing = false, raf = null, counting = false, pendingSeed = null;
  let me, enemies, coins, dist, speed, frame, rng, spawnT, coinT;

  const keys = {};
  let touchX = null;
  addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);
  cv.addEventListener('touchstart', e => touchX = e.touches[0].clientX - cv.getBoundingClientRect().left, {passive:true});
  cv.addEventListener('touchmove',  e => touchX = e.touches[0].clientX - cv.getBoundingClientRect().left, {passive:true});
  cv.addEventListener('touchend',   () => touchX = null);

  function initMatch() {
    me = { x: W/2 - 25, y: H - 110, w: 50, h: 90, alive: true };
    enemies = []; coins = [];
    dist = 0; speed = 5; frame = 0; spawnT = 60; coinT = 120;
    opp = { dist: 0, x: W/2 - 25, alive: true };
  }

  function reset() {
    initMatch();
    if (isHost) {
      // host picks the seed and shares it with the guest
      const seed = Math.floor(Math.random() * 1e9);
      send({ type: 'seed', seed });
      rng = mulberry32(seed);
      beginRace();
    } else if (pendingSeed !== null) {
      // guest得到了seed while its own countdown was still running
      rng = mulberry32(pendingSeed);
      pendingSeed = null;
      beginRace();
    }
    // guest without seed yet: waits for onSeed();
  }

  function beginRace() {
    playing = true;
    $('menu').classList.add('hidden');
    $('raceover').classList.add('hidden');
    if (raf) cancelAnimationFrame(raf);
    loop();
  }

  function startCountdown() {
    if (counting) return;
    counting = true;
    opp = { dist: 0, x: W/2 - 25, alive: true };
    let n = 3;
    setStatus('3');
    const t = setInterval(() => {
      n--;
      if (n > 0) { setStatus(String(n)); }
      else {
        clearInterval(t); counting = false;
        setStatus('GO!'); reset(); setTimeout(() => { if (playing) setStatus(''); }, 800);
      }
    }, 900);
  }

  function onSeed(seed) {
    if (isHost) return;                 // seed only matters for the guest
    if (counting) { pendingSeed = seed; return; }   // wait for own countdown's GO
    initMatch();
    rng = mulberry32(seed);
    beginRace();
  }

  function loop() {
    if (!playing) return;
    update();
    if (!playing) return;
    render();
    raf = requestAnimationFrame(loop);
  }

  function update() {
    frame++;
    speed = 5 + Math.floor(dist / 60);
    dist += speed / 12;

    if (keys['arrowleft']  || keys['a']) me.x -= 7;
    if (keys['arrowright'] || keys['d']) me.x += 7;
    if (touchX !== null) me.x = touchX - me.w / 2;
    me.x = Math.max(70, Math.min(W - 70 - me.w, me.x));

    // deterministic traffic from shared seed (same for both players)
    if (--spawnT <= 0) {
      spawnT = 70;
      const lane = Math.floor(rng() * 3);
      const y = -(rng() * 120);
      const yOff = y; // small jitter from seed
      enemies.push({ x: 70 + lane * ((W - 140) / 3) + 8, y: yOff - 20, w: 50, h: 90,
                     color: ['#e94f64','#4fa3e9','#4fe97f','#e9c94f','#a24fe9'][Math.floor(rng() * 5)] });
    }
    if (--coinT <= 0) {
      coinT = 130;
      const lane = Math.floor(rng() * 3);
      coins.push({ x: 70 + lane * ((W - 140) / 3) + (W - 140) / 6, y: -30, r: 0 });
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.y += speed;
      if (e.y > H) { enemies.splice(i, 1); continue; }
      if (rectsOverlap(me, e)) { crash(); return; }
    }
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.y += speed;
      if (c.y > H) { coins.splice(i, 1); continue; }
      if (c.y + 12 > me.y + 30 && c.y < me.y + me.h - 10 &&
          c.x > me.x - 8 && c.x < me.x + me.w + 8) coins.splice(i, 1);
    }

    // win / sync
    if (dist >= TARGET) { me.won = true; send({ type: 'state', dist, x: me.x, alive: true, won: true }); raceOver(true); return; }
    if (frame % 3 === 0) send({ type: 'state', dist, x: me.x, alive: true });

    // opponent finished?
    if (opp.dist >= TARGET) { me.alive = true; raceOver(false); return; }
  }

  function crash() {
    me.alive = false;
    send({ type: 'state', dist, x: me.x, alive: false });
    raceOver(false, true);
  }

  function raceOver(won, crashed) {
    playing = false;
    const t = $('raceTitle');
    t.textContent = won ? 'YOU WIN! 🏆' : (crashed ? 'WASTED' : 'FRIEND WON');
    t.classList.toggle('win', won);
    $('raceScore').textContent = 'You: ' + dist.toFixed(0) + 'm  ·  Friend: ' + Math.max(opp.dist, 0).toFixed(0) + 'm';
    $('raceover').classList.remove('hidden');
  }

  function rectsOverlap(a, b) {
    const pad = 8;
    return a.x + pad < b.x + b.w && a.x + a.w - pad > b.x &&
           a.y + pad < b.y + b.h && a.y + a.h - pad > b.y;
  }

  // ================= render =================
  function drawRoad() {
    ctx.fillStyle = '#1c1220'; ctx.fillRect(0, 0, W, H);
    const startX = 60, roadW = W - 120;
    ctx.fillStyle = '#25202b'; ctx.fillRect(startX, 0, roadW, H);
    ctx.fillStyle = '#f5f0e6';
    ctx.fillRect(startX + 8, 0, 4, H); ctx.fillRect(startX + roadW - 12, 0, 4, H);
    ctx.fillStyle = '#ffe14f';
    for (let y = -80 + (frame * speed % 80); y < H; y += 80) ctx.fillRect(W/2 - 3, y, 6, 45);
    ctx.fillStyle = 'rgba(255,110,199,.08)';
    ctx.fillRect(0, 0, startX, H); ctx.fillRect(startX + roadW, 0, startX, H);
  }

  function drawCar(x, y, w, h, body, glass) {
    ctx.fillStyle = body;
    rr(x, y, w, h, 10); ctx.fill();
    ctx.fillStyle = glass;
    rr(x + 6, y + 12, w - 12, 18, 5); ctx.fill();
    rr(x + 6, y + h - 30, w - 12, 16, 5); ctx.fill();
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render() {
    drawRoad();
    coins.forEach(c => {
      ctx.fillStyle = '#ffdb34';
      ctx.beginPath(); ctx.arc(c.x, c.y, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fdf3b8'; ctx.font = 'bold 14px Segoe UI';
      ctx.textAlign = 'center'; ctx.fillText('$', c.x, c.y + 5);
    });
    enemies.forEach(e => drawCar(e.x, e.y, e.w, e.h, e.color, '#bff'));

    // friend's ghost car
    if (opp.alive) {
      ctx.globalAlpha = .55;
      drawCar(opp.x, me.y, 50, 90, '#7df9ff', '#e0feff');
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#7df9ff'; ctx.font = 'bold 11px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('FRIEND', opp.x + 25, me.y - 6);
    }

    if (me.alive) drawCar(me.x, me.y, me.w, me.h, '#ffb347', '#ffe');

    // progress bars
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(16, 14, 260, 24); ctx.fillRect(16, 44, 260, 18);
    ctx.fillStyle = '#ffb347';
    ctx.fillRect(18, 16, 256 * Math.min(1, dist / TARGET), 20);
    ctx.fillStyle = '#7df9ff';
    ctx.fillRect(18, 46, 256 * Math.min(1, opp.dist / TARGET), 14);
    ctx.fillStyle = '#fdf3ff'; ctx.font = 'bold 12px Segoe UI'; ctx.textAlign = 'left';
    ctx.fillText('YOU  ' + dist.toFixed(0) + 'm / ' + TARGET + 'm', 24, 30);
    ctx.fillText('FRIEND ' + opp.dist.toFixed(0) + 'm', 24, 56);
  }

  // buttons
  $('hostBtn').addEventListener('click', hostRoom);
  $('showJoinBtn').addEventListener('click', () => { $('joinRow').style.display = 'block'; $('joinCode').focus(); });
  $('joinBtn').addEventListener('click', joinRoom);
  $('joinCode').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
  $('rematchBtn').addEventListener('click', () => {
    if (!conn || !conn.open) { $('raceover').classList.add('hidden'); $('menu').classList.remove('hidden'); setStatus('Connection lost.'); return; }
    if (isHost) startCountdown();
    else send({ type: 'rematch' });
  });

  // nice idle bg
  ctx.fillStyle = '#25202b'; ctx.fillRect(0, 0, W, H);
})();
</script>
</body>
</html>
