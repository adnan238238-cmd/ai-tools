<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vice Drive VI — Browser Demo (v2)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0016;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
  }
  #game { border-radius: 12px; box-shadow: 0 0 60px rgba(255,0,200,.25); cursor: pointer; }

  /* ---------- MENU OVERLAY ---------- */
  #menu {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #1a0033 0%, #4b0f6b 35%, #c22e83 60%, #ff7b4f 80%, #2b0a3d 100%);
    z-index: 10; text-align: center;
  }
  #menu.hidden, #gameover.hidden { display: none; }
  .sun { width: 180px; height: 180px; border-radius: 50%;
         background: linear-gradient(180deg, #ffd24f, #ff5e7e);
         box-shadow: 0 0 80px #ff5e7e, 0 0 160px rgba(255,0,200,.4);
         margin-bottom: 18px;
         background-image: repeating-linear-gradient(0deg, transparent 0 14px, rgba(0,0,0,.35) 14px 20px);
  }
  h1.gta {
    font-size: 60px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(90deg, #7df9ff, #ff6ec7, #ffe14f);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(125,249,255,.35);
    margin-bottom: 6px;
  }
  .sub { color: #ffd9f2; letter-spacing: 8px; font-size: 14px; margin-bottom: 18px; text-transform: uppercase; }
  #highScoreMenu {
    color: #ffe14f; font-weight: 700; font-size: 17px; margin-bottom: 30px;
    text-shadow: 0 0 12px rgba(255,225,79,.6);
  }
  #playBtn {
    font-size: 26px; font-weight: 800; letter-spacing: 3px;
    padding: 16px 60px; border: none; border-radius: 40px; cursor: pointer;
    background: linear-gradient(90deg, #ff6ec7, #7df9ff);
    color: #14001f; text-transform: uppercase;
    box-shadow: 0 0 30px rgba(255,110,199,.6), 0 0 60px rgba(125,249,255,.3);
    transition: transform .15s, box-shadow .15s;
  }
  #playBtn:hover { transform: scale(1.06); box-shadow: 0 0 45px rgba(255,110,199,.9), 0 0 90px rgba(125,249,255,.5); }
  .controls { margin-top: 30px; color: #ffd9f2; font-size: 14px; opacity: .85; }
  kbd { background: rgba(0,0,0,.35); padding: 3px 8px; border-radius: 6px; font-family: inherit; }

  /* ---------- GAME OVER ---------- */
  #gameover {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(20, 0, 30, .82); text-align: center;
  }
  #gameover h2 {
    font-size: 56px; font-weight: 900; letter-spacing: 2px; color: #e6e6e6;
    font-family: 'Times New Roman', serif; text-shadow: 3px 3px 0 #7a0010;
    margin-bottom: 12px;
  }
  #gameover h2.busted { text-shadow: 3px 3px 0 #00327a; }
  #finalScore { color: #7df9ff; font-size: 22px; margin-bottom: 8px; }
  #newHigh { color: #ffe14f; font-size: 16px; font-weight: 700; margin-bottom: 30px; min-height: 20px; }
  #retryBtn {
    font-size: 20px; font-weight: 700; letter-spacing: 2px;
    padding: 12px 44px; border: 2px solid #ff6ec7; border-radius: 40px;
    background: transparent; color: #ffd9f2; cursor: pointer; text-transform: uppercase;
  }
  #retryBtn:hover { background: rgba(255,110,199,.2); }
</style>
</head>
<body>
<div style="position:relative">
  <canvas id="game" width="480" height="720"></canvas>

  <div id="menu">
    <div class="sun"></div>
    <h1 class="gta">VICE&nbsp;DRIVE&nbsp;VI</h1>
    <div class="sub">Fan-made browser demo &middot; v2</div>
    <div id="highScoreMenu"></div>
    <button id="playBtn">▶ Play Now</button>
    <div class="controls">Move: <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> &nbsp;•&nbsp; Touch/drag on phone<br>
    🚔 Police = BUSTED &nbsp;•&nbsp; 🌙 Night falls as you drive &nbsp;•&nbsp; 🔊 Sound on</div>
  </div>

  <div id="gameover" class="hidden">
    <h2 id="overTitle">WASTED</h2>
    <div id="finalScore"></div>
    <div id="newHigh"></div>
    <button id="retryBtn">Retry</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const menu = document.getElementById('menu');
  const over = document.getElementById('gameover');
  const finalScore = document.getElementById('finalScore');
  const newHighEl = document.getElementById('newHigh');
  const overTitle = document.getElementById('overTitle');
  const highScoreMenu = document.getElementById('highScoreMenu');

  // ---------- high score (localStorage) ----------
  const HS_KEY = 'viceDriveHighScore';
  let highScore = parseInt(localStorage.getItem(HS_KEY) || '0', 10);
  function showMenuHigh() {
    highScoreMenu.textContent = highScore > 0 ? '🏆 High Score: ' + highScore : 'No high score yet — set one!';
  }
  showMenuHigh();

  // ---------- sound engine (WebAudio, no files needed) ----------
  let AC = null, engineOsc = null, engineGain = null;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    AC = new (window.AudioContext || window.webkitAudioContext)();
    // engine drone
    engineOsc = AC.createOscillator();
    engineGain = AC.createGain();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 60;
    engineGain.gain.value = 0;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
    engineOsc.connect(lp); lp.connect(engineGain); engineGain.connect(AC.destination);
    engineOsc.start();
  }
  function engine(speed) {
    if (!engineGain) return;
    engineGain.gain.value = 0.035;
    engineOsc.frequency.value = 50 + speed * 9;
  }
  function engineOff() { if (engineGain) engineGain.gain.value = 0; }
  function sfxCrash() {
    if (!AC) return;
    const dur = 0.5, buf = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++)
      d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
    const src = AC.createBufferSource(); src.buffer = buf;
    const g = AC.createGain(); g.gain.value = 0.5;
    src.connect(g); g.connect(AC.destination); src.start();
  }
  function sfxBeep(freq, dur = 0.12, type = 'square', vol = 0.15) {
    if (!AC) return;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }
  function sfxSiren() {
    if (!AC) return;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle';
    g.gain.value = 0.08;
    o.frequency.setValueAtTime(700, AC.currentTime);
    o.frequency.linearRampToValueAtTime(1100, AC.currentTime + 0.18);
    o.frequency.linearRampToValueAtTime(700, AC.currentTime + 0.36);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + 0.36);
  }

  // ---------- state ----------
  let playing = false, raf = null;
  let player, enemies = [], police = [], score = 0, speed = 5,
      frame = 0, roadOffset = 0, sirenTimer = 0;
  const keys = {};
  let touchX = null;

  addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);
  cv.addEventListener('touchmove', e => {
    touchX = e.touches[0].clientX - cv.getBoundingClientRect().left;
  }, {passive: true});
  cv.addEventListener('touchend', () => touchX = null);

  function newGame() {
    initAudio();                                 // sound needs a user gesture
    player = { x: W/2 - 25, y: H - 110, w: 50, h: 90 };
    enemies = []; police = [];
    score = 0; speed = 5; frame = 0; roadOffset = 0; sirenTimer = 0;
    playing = true;
    menu.classList.add('hidden'); over.classList.add('hidden');
    if (raf) cancelAnimationFrame(raf);
    loop();
  }

  function endGame(reason) {
    playing = false;
    engineOff();
    sfxCrash();
    const isPolice = reason === 'police';
    overTitle.textContent = isPolice ? 'BUSTED' : 'WASTED';
    overTitle.classList.toggle('busted', isPolice);
    finalScore.textContent = 'Score: ' + Math.floor(score);
    if (Math.floor(score) > highScore) {
      highScore = Math.floor(score);
      localStorage.setItem(HS_KEY, String(highScore));
      newHighEl.textContent = '🏆 NEW HIGH SCORE!';
    } else {
      newHighEl.textContent = 'Best: ' + highScore;
    }
    over.classList.remove('hidden');
    showMenuHigh();
  }

  // ---------- road ----------
  function laneBounds() { return { x0: 70, x1: W - 70 }; }

  function drawRoad(night) {
    ctx.fillStyle = '#1c1220'; ctx.fillRect(0, 0, W, H);
    const startX = 60, roadW = W - 120;
    ctx.fillStyle = night > 0.5 ? '#181322' : '#25202b';
    ctx.fillRect(startX, 0, roadW, H);
    ctx.fillStyle = '#f5f0e6';
    ctx.fillRect(startX + 8, 0, 4, H); ctx.fillRect(startX + roadW - 12, 0, 4, H);
    ctx.fillStyle = '#ffe14f';
    for (let y = -80 + roadOffset; y < H; y += 80)
      ctx.fillRect(W/2 - 3, y, 6, 45);
    if (night > 0) {                              // streetlights at night
      for (let y = ((roadOffset * 2) % 240) - 120; y < H; y += 240) {
        const gl = ctx.createRadialGradient(startX - 14, y, 2, startX - 14, y, 34);
        gl.addColorStop(0, `rgba(255,225,120,${0.5 * night})`);
        gl.addColorStop(1, 'rgba(255,225,120,0)');
        ctx.fillStyle = gl;
        ctx.fillRect(startX - 48, y - 34, 68, 68);
        ctx.fillRect(startX + roadW - 20, y - 34, 68, 68);
      }
    }
  }

  // ---------- cars ----------
  function drawCar(x, y, w, h, body, glass) {
    ctx.fillStyle = body;
    roundRect(x, y, w, h, 10); ctx.fill();
    ctx.fillStyle = glass;
    roundRect(x + 6, y + 12, w - 12, 18, 5); ctx.fill();
    roundRect(x + 6, y + h - 30, w - 12, 16, 5); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    roundRect(x + 4, y + 34, 10, 20, 4); ctx.fill();
    roundRect(x + w - 14, y + 34, 10, 20, 4); ctx.fill();
  }

  function drawPolice(x, y, w, h) {
    drawCar(x, y, w, h, '#eef2f7', '#9dd');
    ctx.fillStyle = '#111';
    roundRect(x, y, w, 22, {tl:10, tr:10, br:0, bl:0} && 4); ctx.fill(); // hood stripe
    // flashing light bar
    const phase = Math.floor(frame / 8) % 2;
    ctx.fillStyle = phase ? '#ff2b3d' : 'rgba(255,43,61,.35)';
    ctx.fillRect(x + 6, y + 26, 16, 8);
    ctx.fillStyle = phase ? 'rgba(43,110,255,.35)' : '#2b6eff';
    ctx.fillRect(x + 28, y + 26, 16, 8);
    if (phase) {                                  // glow
      ctx.fillStyle = 'rgba(43,110,255,.25)';
      ctx.fillRect(x - 8, y + 10, w + 16, 40);
    }
  }

  function headlightCone(x, y, w) {               // beam under the player's car
    const g = ctx.createLinearGradient(0, y - 160, 0, y);
    g.addColorStop(0, 'rgba(255,250,200,0)');
    g.addColorStop(1, 'rgba(255,250,200,.22)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x + 4, y + 6);
    ctx.lineTo(x - 12, y - 170);
    ctx.lineTo(x + w + 12, y - 170);
    ctx.lineTo(x + w - 4, y + 6);
    ctx.closePath(); ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const ENEMY_COLORS = ['#e94f64', '#4fa3e9', '#4fe97f', '#e9c94f', '#a24fe9'];

  // ---------- update ----------
  function update() {
    frame++;
    roadOffset = (roadOffset + speed) % 80;
    score += 0.1;
    speed = 5 + Math.floor(score / 40);
    engine(speed);
    const minGap = Math.max(130, 260 - frame / 30);
    const night = Math.min(1, score / 300);        // full night by score 300

    // player movement
    if (keys['arrowleft']  || keys['a']) player.x -= 7;
    if (keys['arrowright'] || keys['d']) player.x += 7;
    if (touchX !== null) player.x = touchX - player.w / 2;
    player.x = Math.max(70, Math.min(W - 70 - player.w, player.x));

    // traffic spawns
    if (frame % Math.floor(minGap) === 0) {
      const laneW = (W - 140) / 3;
      const lane = Math.floor(Math.random() * 3);
      enemies.push({ x: 70 + lane * laneW + 8, y: -100, w: 50, h: 90,
                     color: ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)] });
    }

    // police spawns every ~12s of play, faster at higher scores
    if (frame % (900 - Math.min(300, Math.floor(score))) === 0) {
      police.push({ x: W/2 - 25, y: -120, w: 50, h: 90, vx: 0 });
      sfxSiren();
    }
    sirenTimer--;
    if (police.length && sirenTimer <= 0) { sfxSiren(); sirenTimer = 90; }

    // move traffic + collision
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.y += speed;
      if (e.y > H) { enemies.splice(i, 1); continue; }
      if (rectsOverlap(player, e)) { endGame('traffic'); return; }
    }

    // police: homing + collision
    for (let i = police.length - 1; i >= 0; i--) {
      const p = police[i];
      p.y += speed * 0.25;                                  // rises on screen slowly
      p.vx += (player.x - p.x) * 0.004;                     // steer toward player
      p.vx = Math.max(-2.2, Math.min(2.2, p.vx));
      p.x += p.vx;
      p.x = Math.max(70, Math.min(W - 70 - p.w, p.x));
      if (p.y > H) { police.splice(i, 1); continue; }
      if (rectsOverlap(player, p)) { endGame('police'); return; }
    }

    // milestone chime every 50 points
    if (Math.floor(score) % 50 === 0 && frame > 10 && Math.floor(score) > 0) {
      if (!update._lastChime || update._lastChime !== Math.floor(score))
        { sfxBeep(880, 0.15, 'sine', 0.12); update._lastChime = Math.floor(score); }
    }
  }

  function rectsOverlap(a, b) {
    const pad = 8;
    return a.x + pad < b.x + b.w && a.x + a.w - pad > b.x &&
           a.y + pad < b.y + b.h && a.y + a.h - pad > b.y;
  }

  // ---------- render ----------
  function render() {
    const night = Math.min(1, score / 300);
    if (!playing) nightCache = nightCache; // keep last level on game-over screen
    drawRoad(night);

    const glare = night > 0;
    if (glare) headlightCone(player.x, player.y, player.w);

    enemies.forEach(e => drawCar(e.x, e.y, e.w, e.h, e.color, glare ? '#fffeee' : '#bff'));
    if (playing) {
      police.forEach(p => drawPolice(p.x, p.y, p.w, p.h));
      drawCar(player.x, player.y, player.w, player.h, '#ffb347', glare ? '#fffbe0' : '#ffe');
      // taillights at night
      if (glare) {
        ctx.fillStyle = 'rgba(255,60,60,.85)';
        ctx.fillRect(player.x + 6, player.y + player.h - 6, 10, 5);
        ctx.fillRect(player.x + player.w - 16, player.y + player.h - 6, 10, 5);
      }
    }

    // night tint overlay
    if (night > 0) {
      ctx.fillStyle = `rgba(8,4,32,${0.45 * night})`;
      ctx.fillRect(0, 0, W, H);
    }

    // HUD
    ctx.fillStyle = '#fdf3ff';
    ctx.font = 'bold 20px Segoe UI, Arial';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE  ' + Math.floor(score), 16, 32);
    ctx.font = '13px Segoe UI, Arial';
    ctx.fillStyle = 'rgba(253,243,255,.65)';
    ctx.fillText('speed ' + speed + (police.length ? '   🚔 POLICE!' : ''), 16, 52);
    ctx.textAlign = 'right';
    ctx.fillText('🏆 ' + highScore, W - 16, 32);
  }

  let nightCache = 0; // (overlay uses live score while playing)

  function loop() {
    if (!playing) return;
    update();
    if (!playing) return;
    render();
    raf = requestAnimationFrame(loop);
  }

  // buttons
  document.getElementById('playBtn').addEventListener('click', newGame);
  document.getElementById('retryBtn').addEventListener('click', newGame);

  // idle background behind menu
  score = 0; render();
})();
</script>
</body>
</html>
